name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Build site
        run: bundle exec middleman build

      # Runs the content specs and the axe-core accessibility specs. The
      # accessibility specs serve the build/ output produced above, so the
      # build must run first.
      - name: Run tests (RSpec, incl. axe-core accessibility checks)
        run: bundle exec rspec
